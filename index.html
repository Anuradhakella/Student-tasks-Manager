<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Task Manager</title>
  <meta name="description" content="A simple task manager for students to track assignments, exams and deadlines." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <div class="logo">📚</div>
      <div>
        <h1>Student Task Manager</h1>
        <p class="subtitle">Stay on top of assignments, exams and deadlines.</p>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Statistics -->
    <section class="stats" aria-label="Task statistics">
      <div class="stat-card total">
        <span class="stat-label">Total</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
      <div class="stat-card done">
        <span class="stat-label">Completed</span>
        <span class="stat-value" id="completedCount">0</span>
      </div>
      <div class="stat-card pending">
        <span class="stat-label">Pending</span>
        <span class="stat-value" id="pendingCount">0</span>
      </div>
    </section>

    <!-- Add task form -->
    <section class="card">
      <h2>Add a new task</h2>
      <form id="taskForm" novalidate>
        <div class="form-grid">
          <div class="field field-wide">
            <label for="taskName">Task name</label>
            <input type="text" id="taskName" placeholder="e.g. Finish math assignment" maxlength="100" />
          </div>
          <div class="field">
            <label for="dueDate">Due date</label>
            <input type="date" id="dueDate" />
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority">
              <option value="High">High</option>
              <option value="Medium" selected>Medium</option>
              <option value="Low">Low</option>
            </select>
          </div>
        </div>
        <p class="error" id="errorMsg" role="alert"></p>
        <button type="submit" class="btn btn-primary">+ Add Task</button>
      </form>
    </section>

    <!-- Task list -->
    <section class="card">
      <div class="list-header">
        <h2>Your tasks</h2>
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
      </div>
      <ul id="taskList" class="task-list"></ul>
      <div id="emptyState" class="empty">
        <div class="empty-icon">🎉</div>
        <p>No tasks here. Enjoy your free time — or add a new task above!</p>
      </div>
    </section>
  </main>

  <footer class="footer">Made with HTML, CSS &amp; JavaScript</footer>

  <script src="script.js"></script>
</body>
</html>
